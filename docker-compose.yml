services:
  ofta-fhir-service:
    build:
      context: ./ofta-fhir-service
      dockerfile: Dockerfile
    container_name: ofta-fhir-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    volumes:
      - ofta_fhir_data:/app/data
    restart: unless-stopped

volumes:
  ofta_fhir_data:
